# Post-installation tasks:
# 1. Inject StartupWMClass into the system .desktop file for correct icon association
# 2. Remove conflicting ewokvpn.desktop files from users' .local directories (cleanup AppImage artifacts)
# 3. Update the desktop database to apply changes immediately
postinstall_scripts:
  - echo "Setting up EwokVPN..."
  - sudo sed -i '/^\[Desktop Entry\]/a StartupWMClass=com.ewokvpn.app' "/usr/share/applications/ewokvpn.desktop"
  - echo "Search and remove ewokvpn.desktop from .local"
  - for user_dir in /home/*; do if [ -f "$user_dir/.local/share/applications/ewokvpn.desktop" ]; then rm -f "$user_dir/.local/share/applications/ewokvpn.desktop"; echo "Found and removed ewokvpn.desktop from $user_dir .local"; fi; done
  - update-desktop-database /usr/share/applications
  - echo "EwokVPN is ready to use :)"

# Post-uninstallation tasks:
# 1. Iterate through all user directories to remove EwokVPN configuration and data
# 2. Clean up root user data to ensure a clean removal
postuninstall_scripts:
  - echo "Removing EwokVPN user data..."
  - for user_dir in /home/*; do for d in ewokvpn com.ewokvpn.app; do if [ -d "$user_dir/.local/share/$d" ]; then rm -rf "$user_dir/.local/share/$d"; echo "Removed data from $user_dir"; fi; done; done
  - rm -rf /root/.local/share/ewokvpn /root/.local/share/com.ewokvpn.app
  - echo "EwokVPN data cleanup complete."

